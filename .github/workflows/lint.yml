# Go Lint workflow to lint the Go project.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go Lint

on:
  pull_request:
    paths:
      - '**.go'
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      # The action installs and runs golangci-lint, failing the job on issues.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest